name: Temporary exact-image formatter
on:
  push:
    branches:
      - fix/exact-set-image-fallback-me06-20261110
permissions:
  contents: write
jobs:
  prettier:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/exact-set-image-fallback-me06-20261110
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/ui/catalog-browser.ts
      - name: Remove temporary workflow and commit formatted file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/image-format-temp.yml
          git add src/ui/catalog-browser.ts
          git commit -m "Format image fallback and remove temporary formatter"
          git push origin HEAD:refs/heads/fix/exact-set-image-fallback-me06-20261110

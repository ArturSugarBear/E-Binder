name: Check and publish E-Binder
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e-binder-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Resolve and audit release artwork
        run: node scripts/release-artwork-gate.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artwork-availability-report
          path: public/catalog-art/audit.json
          retention-days: 14
      - run: npm run check
      - name: Verify Rare Room brand source
        run: node scripts/validate-brand.mjs
      - name: Refresh and build dated Cardmarket price guide
        run: |
          node scripts/refresh-cardmarket.mjs
          node scripts/refresh-japanese-catalog.mjs M1L M1S
          npm run audit:providers
          npm run build
      - run: node scripts/verify-competitor-media.mjs
      # Browser downloads are cached between runs. For pull requests the
      # full Chromium desktop/mobile suite gives fast feedback; master
      # still gates publishing on the full Chromium + WebKit suite.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.65.0
      - name: Prepare browsers for the required test scope
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # GitHub-hosted Ubuntu runners ship Chrome; avoid a redundant
            # browser+apt installation on the fast feedback path.
            if ! command -v google-chrome >/dev/null 2>&1; then
              npx playwright install --with-deps chromium
            fi
          else
            npx playwright install --with-deps chromium webkit
          fi
      - name: Browser regression
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            if command -v google-chrome >/dev/null 2>&1; then
              export PLAYWRIGHT_CHROMIUM_EXECUTABLE="$(command -v google-chrome)"
            fi
            npx playwright test \
              tests/e2e/binder-page-scan.spec.ts \
              tests/e2e/set-first-scan.spec.ts \
              tests/e2e/photo-review.spec.ts \
              tests/e2e/collection-prices.spec.ts \
              tests/e2e/portfolio.spec.ts \
              tests/e2e/p0-resolvers.spec.ts \
              tests/e2e/real-collector-flows.spec.ts \
              tests/e2e/mobile-binder-entry.spec.ts \
              tests/e2e/pwa.spec.ts \
              tests/e2e/catalog-images.spec.ts \
              tests/e2e/set-art-fallback.spec.ts \
              tests/e2e/liquid-collector.spec.ts \
              tests/e2e/beta-mobile-ergonomics.spec.ts \
              tests/e2e/rare-room-release.spec.ts \
              --project=chromium --project=mobile-chromium
            # The live camera is an iPhone-first surface. Exercise its
            # repeat-scan, camera-rejection and track-cleanup regressions
            # once on mobile Chromium instead of duplicating on desktop.
            # The next Playwright invocation clears test-results. Preserve
            # the first suite's real responsive screenshots before it starts.
            mkdir -p rare-room-screenshots
            find test-results -type f -name 'rare-room-*.png' -print0 |
              while IFS= read -r -d '' screenshot; do
                output="rare-room-screenshots/${screenshot#test-results/}"
                mkdir -p "$(dirname "$output")"
                cp "$screenshot" "$output"
              done
            npx playwright test \
              tests/e2e/live-scan.spec.ts \
              tests/e2e/live-scan-battle.spec.ts \
              --project=mobile-chromium
          else
            npm run test:e2e
          fi
          # Persist final master/WebKit evidence as well as first PR suite.
          mkdir -p rare-room-screenshots
          find test-results -type f -name 'rare-room-*.png' -print0 |
            while IFS= read -r -d '' screenshot; do
              output="rare-room-screenshots/${screenshot#test-results/}"
              mkdir -p "$(dirname "$output")"
              cp "$screenshot" "$output"
            done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Capture Rare Room responsive QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rare-room-browser-qa
          path: |
            rare-room-screenshots/
            test-results/**/rare-room-*.png
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Check and publish E-Binder
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e-binder-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # This pilot is opt-in, not a universal image recognizer.
      # Build model/index from the SAME pinned ONNX weights and exactly nine
      # publisher-checked, already bundled image references. No donor JPEGs.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and verify local visual AI beta
        run: |
          python -m pip install --disable-pip-version-check 'numpy==2.2.6' 'pillow==11.3.0' 'onnxruntime==1.23.2'
          curl --fail --location --retry 3 --retry-delay 3 --max-time 180 \
            'https://huggingface.co/onnx-community/dinov2-small-ONNX/resolve/08c606e/onnx/model_quantized.onnx' \
            -o /tmp/ebinder-dinov2-small-beta.onnx
          echo '7cfc69bd1874d20b9dbecdab057f21aeac7b90c2f560bd0fb66af86c78024f62  /tmp/ebinder-dinov2-small-beta.onnx' | sha256sum --check
          node scripts/prepare-visual-beta-input.mjs
          python scripts/embed-card-references.py \
            visual-beta-reference-input.json \
            /tmp/ebinder-dinov2-small-beta.onnx \
            /tmp/ebinder-visual-vectors.json
          node scripts/pack-visual-index.mjs \
            /tmp/ebinder-visual-vectors.json \
            /tmp/ebinder-dinov2-small-beta.onnx \
            public/assets/vision
          node scripts/verify-visual-beta.mjs
          rm visual-beta-reference-input.json
      - name: Resolve and audit release artwork
        run: node scripts/release-artwork-gate.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artwork-availability-report
          path: public/catalog-art/audit.json
          retention-days: 14
      - run: npm run check
      - name: Verify exact-print artwork fallback (DE / EN / JA)
        run: npm run audit:card-images
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: card-image-coverage-smoke
          path: artifacts/card-artwork-coverage.json
          retention-days: 14
      # External catalogues intermittently return HTTP 503. A push should
      # deploy the already validated, dated snapshots; the scheduled/manual
      # run refreshes and revalidates live third-party data separately.
      - name: Refresh and build dated Cardmarket price guide
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          node scripts/refresh-cardmarket.mjs
          node scripts/refresh-japanese-catalog.mjs M1L M1S
          npm run audit:providers
          npm run build
      - run: node scripts/verify-competitor-media.mjs
      # Browser downloads are cached between runs. For pull requests the
      # full Chromium desktop/mobile suite gives fast feedback; master
      # still gates publishing on the full Chromium + WebKit suite.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.65.0
      - name: Prepare browsers for the required test scope
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # GitHub-hosted Ubuntu runners ship Chrome; avoid a redundant
            # browser+apt installation on the fast feedback path.
            if ! command -v google-chrome >/dev/null 2>&1; then
              npx playwright install --with-deps chromium
            fi
          else
            npx playwright install --with-deps chromium webkit
          fi
      - name: Browser regression
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            if command -v google-chrome >/dev/null 2>&1; then
              export PLAYWRIGHT_CHROMIUM_EXECUTABLE="$(command -v google-chrome)"
            fi
            npx playwright test \
              tests/e2e/binder-page-scan.spec.ts \
              tests/e2e/set-first-scan.spec.ts \
              tests/e2e/set-filters.spec.ts \
              tests/e2e/native-touch.spec.ts \
              tests/e2e/workspace.spec.ts \
              tests/e2e/photo-review.spec.ts \
              tests/e2e/collection-prices.spec.ts \
              tests/e2e/portfolio.spec.ts \
              tests/e2e/p0-resolvers.spec.ts \
              tests/e2e/real-collector-flows.spec.ts \
              tests/e2e/mobile-binder-entry.spec.ts \
              tests/e2e/pwa.spec.ts \
              tests/e2e/catalog-images.spec.ts \
              tests/e2e/compact-card-sheet.spec.ts \
              tests/e2e/visual-beta.spec.ts \
              tests/e2e/classic-collection.spec.ts \
              tests/e2e/binder-card-artwork.spec.ts \
              tests/e2e/set-art-fallback.spec.ts \
              tests/e2e/liquid-collector.spec.ts \
              tests/e2e/beta-mobile-ergonomics.spec.ts \
              --project=chromium --project=mobile-chromium
            # The live camera is an iPhone-first surface. Exercise its
            # repeat-scan, camera-rejection and track-cleanup regressions
            # once on mobile Chromium instead of duplicating on desktop.
            npx playwright test \
              tests/e2e/live-scan.spec.ts \
              tests/e2e/live-scan-battle.spec.ts \
              --project=mobile-chromium
          else
            npm run test:e2e
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist
  card-image-coverage-full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Scan every TCGdex set and card (DE, EN, JA)
        run: node scripts/audit-catalog-card-coverage.mjs --full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: card-image-coverage-full
          path: artifacts/card-artwork-coverage.json
          retention-days: 30
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

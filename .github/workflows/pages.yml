name: Check and publish E-Binder
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e-binder-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Surface code errors before downloading model weights or probing the
      # third-party catalogue. On failure show the exact Prettier patch while
      # still failing the check; never silently normalize source in CI.
      - name: Early formatting gate with repair diff
        run: |
          if ! npm run format:check; then
            npx prettier --write .
            git diff -- src scripts tests .github/workflows
            exit 1
          fi
      # This pilot is opt-in, not a universal image recognizer.
      # Build model/index from the SAME pinned ONNX weights and exactly nine
      # publisher-checked, already bundled image references. No donor JPEGs.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and verify local visual AI beta
        run: |
          python -m pip install --disable-pip-version-check 'numpy==2.2.6' 'pillow==11.3.0' 'onnxruntime==1.23.2'
          curl --fail --location --retry 3 --retry-delay 3 --max-time 180 \
            'https://huggingface.co/onnx-community/dinov2-small-ONNX/resolve/08c606e/onnx/model_quantized.onnx' \
            -o /tmp/ebinder-dinov2-small-beta.onnx
          echo '7cfc69bd1874d20b9dbecdab057f21aeac7b90c2f560bd0fb66af86c78024f62  /tmp/ebinder-dinov2-small-beta.onnx' | sha256sum --check
          node scripts/prepare-visual-beta-input.mjs
          python scripts/embed-card-references.py \
            visual-beta-reference-input.json \
            /tmp/ebinder-dinov2-small-beta.onnx \
            /tmp/ebinder-visual-vectors.json
          node scripts/pack-visual-index.mjs \
            /tmp/ebinder-visual-vectors.json \
            /tmp/ebinder-dinov2-small-beta.onnx \
            public/assets/vision
          node scripts/verify-visual-beta.mjs
          rm visual-beta-reference-input.json
      - name: Resolve and audit release artwork
        run: node scripts/release-artwork-gate.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artwork-availability-report
          path: public/catalog-art/audit.json
          retention-days: 14
      - run: npm run check
      - name: Verify exact-print artwork fallback (DE / EN / JA)
        run: node scripts/release-card-image-coverage-gate.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: card-image-coverage-smoke
          path: artifacts/card-artwork-coverage.json
          retention-days: 14
      # Manual release and master pushes must not depend on third-party 503s.
      # Refresh external catalogues only on the scheduled data-maintenance run.
      # The existing snapshots still pass build, artwork and browser checks.
      - name: Refresh and build dated Cardmarket price guide
        if: github.event_name == 'schedule'
        run: |
          node scripts/refresh-cardmarket.mjs
          node scripts/refresh-japanese-catalog.mjs M1L M1S
          npm run audit:providers
          npm run build
      - run: node scripts/verify-competitor-media.mjs
      # Browser downloads are cached between runs. Pull requests and master
      # both require the complete Chromium, mobile-emulation and WebKit suite.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.65.0
      # Scanner releases require the full browser suite before merge.
      # Desktop WebKit is a compatibility check, not physical iPhone evidence.
      - name: Prepare browsers for the required test scope
        run: npx playwright install --with-deps chromium webkit
      - name: Browser regression (full Chromium + WebKit)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist
  card-image-coverage-full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Scan every TCGdex set and card (DE, EN, JA)
        run: node scripts/audit-catalog-card-coverage.mjs --full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: card-image-coverage-full
          path: artifacts/card-artwork-coverage.json
          retention-days: 30
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-production:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify published version matches deployed master
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          expected="${EXPECTED_SHA:0:12}"
          for attempt in {1..20}; do
            actual="$(curl -fsSL --retry 2 "https://artursugarbear.github.io/E-Binder/version.json?release=${EXPECTED_SHA}" | python3 -c 'import json,sys;print(json.load(sys.stdin)["commit"])' 2>/dev/null || true)"
            if [[ "$actual" == "$expected" ]]; then
              echo "Published Pages version verified: $actual"
              exit 0
            fi
            echo "Waiting for Pages propagation (attempt $attempt): published=${actual:-unavailable}, expected=$expected"
            sleep 6
          done
          echo "::error::Published Pages version did not match deployed master"
          exit 1
      - name: Prepare production browser
        run: npx playwright install --with-deps chromium
      - name: Exercise deployed scanner and real ONNX Worker
        env:
          E2E_BASE_URL: https://artursugarbear.github.io/E-Binder/
        run: |
          npx playwright test \
            tests/e2e/vision-inference.spec.ts \
            tests/e2e/scan-zero-match-recovery.spec.ts \
            tests/e2e/live-scan.spec.ts \
            --project=chromium \
            --grep 'real local vision Worker|zero-match scanner|live scanner offers'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: production-scanner-smoke-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

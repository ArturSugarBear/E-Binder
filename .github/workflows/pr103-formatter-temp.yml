name: Temporary guest beta formatter
on:
  push:
    branches:
      - release/guest-beta-recovery-20261112
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[formatted-guest-beta]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format scanner and consent changes
        run: |
          npx prettier --write \
            src/data/beta-scan-donation.ts \
            src/ui/add-cards.ts \
            src/workspace.css \
            tests/e2e/guest-beta-consent.spec.ts \
            tests/e2e/scan-zero-match-recovery.spec.ts \
            tests/unit/beta-guest-donation.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/beta-scan-donation.ts src/ui/add-cards.ts src/workspace.css tests/e2e/guest-beta-consent.spec.ts tests/e2e/scan-zero-match-recovery.spec.ts tests/unit/beta-guest-donation.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format guest beta and scanner recovery [formatted-guest-beta]"
            git push origin HEAD:release/guest-beta-recovery-20261112
          fi

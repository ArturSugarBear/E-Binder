name: Temporary lovebrand formatter
on:
  push:
    branches:
      - design/lovebrand-impeccable-brand-kit
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format brand lab and design artifacts
        run: |
          npx prettier --write PRODUCT.md brand/BRAND-KIT.md brand/tokens.css brand/tokens.json public/brand-lab.html tests/unit/brand-tokens.test.ts tests/e2e/brand-lab.spec.ts
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add PRODUCT.md brand/BRAND-KIT.md brand/tokens.css brand/tokens.json public/brand-lab.html tests/unit/brand-tokens.test.ts tests/e2e/brand-lab.spec.ts
            git commit -m "Format three lovebrand identities and interactive preview"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

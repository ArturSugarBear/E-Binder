name: Temporary native UX formatter
on:
  push:
    branches:
      - feat/native-touch-navigation-and-sheets-20261110
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format native gesture implementation
        run: |
          npx prettier --write src/ui/sheet-gestures.ts src/ui/workspace-dom.ts src/ui/card-dialog.ts src/ui/binder-view.ts src/ui/collection-view.ts src/ui/discover-view.ts src/workspace.css src/styles.css tests/unit/sheet-gestures.test.ts tests/e2e/native-touch.spec.ts docs/design.md
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/ui/sheet-gestures.ts src/ui/workspace-dom.ts src/ui/card-dialog.ts src/ui/binder-view.ts src/ui/collection-view.ts src/ui/discover-view.ts src/workspace.css src/styles.css tests/unit/sheet-gestures.test.ts tests/e2e/native-touch.spec.ts docs/design.md
            git commit -m "Format native touch navigation"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

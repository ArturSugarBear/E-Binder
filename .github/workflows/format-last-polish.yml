name: Format final premium fix
on:
  push:
    branches: [release/rare-room-liquid-collector-20261110]
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'ArturSugarBear/E-Binder'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format code and remove one-shot workflow
        run: |
          npx prettier --write src/ui/add-cards.ts src/ui/portfolio-view.ts src/data/card-images.ts src/workspace.css tests/unit/catalog.test.ts tests/unit/market-price-fallback.test.ts
          git rm .github/workflows/format-last-polish.yml
          git add src/ui/add-cards.ts src/ui/portfolio-view.ts src/data/card-images.ts src/workspace.css tests/unit/catalog.test.ts tests/unit/market-price-fallback.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Format confirmation, price and artwork improvements"
            git push origin HEAD:release/rare-room-liquid-collector-20261110
          fi

name: P07 branch formatter (temporary)
on:
  push:
    branches:
      - feature/p07-rapid-scan-and-visual-evaluation
    paths:
      - .github/workflows/p07-formatter.yml
permissions:
  contents: write
jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/p07-rapid-scan-and-visual-evaluation
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format P07 feature files
        run: >
          npx prettier --write
          docs/research/rapidocr-hybrid-p07.md
          src/domain/scan-capture-latch.ts
          src/ui/add-cards.ts
          src/ui/live-scan.ts
          src/workspace.css
          tests/e2e/live-scan-battle.spec.ts
          tests/e2e/live-scan.spec.ts
          tests/unit/scan-capture-latch.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/rapidocr-hybrid-p07.md src/domain/scan-capture-latch.ts src/ui/add-cards.ts src/ui/live-scan.ts src/workspace.css tests/e2e/live-scan-battle.spec.ts tests/e2e/live-scan.spec.ts tests/unit/scan-capture-latch.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "Apply Prettier to P07 live scanner and RapidOCR research"
            git push origin HEAD:feature/p07-rapid-scan-and-visual-evaluation
          fi

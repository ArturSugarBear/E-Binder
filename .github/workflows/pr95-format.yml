name: Temporary PR95 Prettier formatter
on:
  push:
    branches:
      - fix/30th-classic-art-and-live-scanner-20261112
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[formatted]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format only the scanner and Classic Collection changes
        run: >
          npx prettier --write
          scripts/audit-catalog-art.mjs
          src/domain/card-outline.ts
          src/ui/live-scan.ts
          tests/unit/artwork-fallbacks.test.ts
          tests/unit/card-outline.test.ts
      - name: Commit reproducible formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit-catalog-art.mjs src/domain/card-outline.ts src/ui/live-scan.ts tests/unit/artwork-fallbacks.test.ts tests/unit/card-outline.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Prettier to PR95 [formatted]"
            git push origin HEAD:fix/30th-classic-art-and-live-scanner-20261112
          fi

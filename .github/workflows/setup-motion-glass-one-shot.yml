name: Install vetted interaction libraries
on:
  push:
    branches: [feat/liquid-collector-beta-20261110]
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Pin motion and liquid glass with lockfile
        run: |
          npm install motion@14.12.0 simple-liquid-glass@5.7.0 --save-exact --no-audit
          git rm .github/workflows/setup-motion-glass-one-shot.yml
          git add package.json package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Pin Motion and Safari-compatible liquid glass engine"
          git push origin HEAD:feat/liquid-collector-beta-20261110

name: Temporary discovery dialog test formatter
on:
  push:
    branches:
      - fix/discover-card-detail-centered-premium-20261110
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write tests/e2e/discover.spec.ts
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/e2e/discover.spec.ts
            git commit -m "Format Discover card-modal regression tests"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

name: P09 branch-only formatter
on:
  push:
    branches:
      - feature/p09-batch-scan-session-guardrails
    paths:
      - .github/workflows/p09-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/p09-batch-scan-session-guardrails
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Sync current feature head
        run: |
          git fetch origin feature/p09-batch-scan-session-guardrails
          git reset --hard origin/feature/p09-batch-scan-session-guardrails
      - name: Format P07 inherited and P09 source files
        run: npx prettier --write src/data/recognize.ts src/data/vision-worker.ts src/domain/live-ocr-policy.ts src/domain/scan-session-guardrails.ts src/ui/add-cards.ts src/ui/live-scan.ts tests/e2e/live-scan.spec.ts tests/unit/live-ocr-policy.test.ts tests/unit/scan-session-guardrails.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/recognize.ts src/data/vision-worker.ts src/domain/live-ocr-policy.ts src/domain/scan-session-guardrails.ts src/ui/add-cards.ts src/ui/live-scan.ts tests/e2e/live-scan.spec.ts tests/unit/live-ocr-policy.test.ts tests/unit/scan-session-guardrails.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "Format P07/P09 scan guardrail changes"
            git push origin HEAD:feature/p09-batch-scan-session-guardrails
          fi

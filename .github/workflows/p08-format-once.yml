name: P08 format once (temporary)
on:
  push:
    branches:
      - feature/p08-visual-retrieval-single-card
    paths:
      - .github/workflows/p08-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/p08-visual-retrieval-single-card
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format only P08 files
        run: npx prettier --write src/data/scan-visual-shortlist.ts src/data/visual-search.ts src/data/scan-auto-resolve.ts src/ui/add-cards.ts tests/unit/scan-visual-shortlist.test.ts docs/p08-visual-retrieval.md scripts/benchmark-card-scans.mjs
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/scan-visual-shortlist.ts src/data/visual-search.ts src/data/scan-auto-resolve.ts src/ui/add-cards.ts tests/unit/scan-visual-shortlist.test.ts docs/p08-visual-retrieval.md scripts/benchmark-card-scans.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Format P08 visual retrieval"
            git push origin HEAD:feature/p08-visual-retrieval-single-card
          fi

name: P07 one-time formatting hotfix
on:
  push:
    branches:
      - feature/p07-rapid-scan-and-visual-evaluation
    paths:
      - .github/workflows/p07-format-hotfix.yml
permissions:
  contents: write
jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/p07-rapid-scan-and-visual-evaluation
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format live multi-pass OCR and test files
        run: >
          npx prettier --write
          src/domain/live-ocr-policy.ts
          src/data/recognize.ts
          src/data/vision-worker.ts
          src/ui/add-cards.ts
          src/ui/live-scan.ts
          tests/unit/live-ocr-policy.test.ts
          tests/e2e/live-scan-battle.spec.ts
      - name: Commit only formatting if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/live-ocr-policy.ts src/data/recognize.ts src/data/vision-worker.ts src/ui/add-cards.ts src/ui/live-scan.ts tests/unit/live-ocr-policy.test.ts tests/e2e/live-scan-battle.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "Format P07 bounded live multi-pass recognition"
            git push origin HEAD:feature/p07-rapid-scan-and-visual-evaluation
          fi

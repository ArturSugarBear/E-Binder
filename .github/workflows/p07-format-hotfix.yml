name: P07 one-time formatting hotfix
on:
  push:
    branches:
      - feature/p07-rapid-scan-and-visual-evaluation
    paths:
      - .github/workflows/p07-format-hotfix.yml
permissions:
  contents: write
jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/p07-rapid-scan-and-visual-evaluation
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/ui/add-cards.ts
      - name: Commit only formatting if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/add-cards.ts
          if ! git diff --cached --quiet; then
            git commit -m "Format P07 OCR scan orchestrator"
            git push origin HEAD:feature/p07-rapid-scan-and-visual-evaluation
          fi

name: Temporary scanner-grid formatter
on:
  push:
    branches:
      - feat/scanner-pocket-seam-fallback-20261110
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format scanner and manual capture code
        run: |
          npx prettier --write src/domain/page-pocket-grid.ts src/data/auto-page-align.ts src/ui/page-scan.ts src/ui/add-cards.ts tests/unit/page-pocket-grid.test.ts docs/scanner.md
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/domain/page-pocket-grid.ts src/data/auto-page-align.ts src/ui/page-scan.ts src/ui/add-cards.ts tests/unit/page-pocket-grid.test.ts docs/scanner.md
            git commit -m "Format binder grid scanner changes"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

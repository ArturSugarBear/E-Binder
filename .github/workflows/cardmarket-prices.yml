name: Refresh validated Cardmarket printing prices
on:
  schedule:
    - cron: '20 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: cardmarket-validated-price-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Independently verify card identities and import the daily guide
        run: node scripts/build-cardmarket-verified.mjs
      - name: Commit checked public pricing reference
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/prices/cardmarket-verified.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified Cardmarket daily price references'
            git push origin HEAD:master
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Run full release checks and Pages deployment
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref master

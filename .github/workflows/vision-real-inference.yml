name: Vision real inference smoke
on:
  push:
    branches: [feat/vision-readiness-gate]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-onnx-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare genuine pinned DINOv2 index
        run: |
          python -m pip install --disable-pip-version-check 'numpy==2.2.6' 'pillow==11.3.0' 'onnxruntime==1.23.2'
          curl --fail --location --retry 3 --max-time 180 \
            'https://huggingface.co/onnx-community/dinov2-small-ONNX/resolve/08c606e/onnx/model_quantized.onnx' \
            -o /tmp/ebinder-vision-model.onnx
          echo '7cfc69bd1874d20b9dbecdab057f21aeac7b90c2f560bd0fb66af86c78024f62  /tmp/ebinder-vision-model.onnx' | sha256sum --check
          node scripts/prepare-visual-beta-input.mjs
          python scripts/embed-card-references.py visual-beta-reference-input.json /tmp/ebinder-vision-model.onnx /tmp/vision-embeddings.json
          node scripts/pack-visual-index.mjs /tmp/vision-embeddings.json /tmp/ebinder-vision-model.onnx public/assets/vision
          node scripts/check-vision-release.mjs public/assets/vision
          python scripts/smoke-visual-inference.py visual-beta-reference-input.json /tmp/ebinder-vision-model.onnx public/assets/vision artifacts/vision-cpu-smoke.json
          rm visual-beta-reference-input.json
      - name: Prepare the actual PWA build
        run: |
          node scripts/release-artwork-gate.mjs
          npm run build
      - name: Install real WebKit and Chromium
        run: npx playwright install --with-deps chromium webkit
      - name: Execute browser ONNX inference in both engines
        run: npx playwright test tests/e2e/vision-inference.spec.ts --project=chromium --project=webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-vision-inference-evidence
          path: |
            artifacts/vision-cpu-smoke.json
            playwright-report/
            test-results/
          retention-days: 14

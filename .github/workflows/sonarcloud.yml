# SonarCloud is not configured yet. Until the token and project keys are set,
# keep this optional external analysis manual so it cannot break Pages delivery.
# Setup: SONAR_TOKEN secret, SONAR_PROJECT_KEY and SONAR_ORGANIZATION variables.
name: SonarCloud analysis

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Verify SonarCloud configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          if [[ -z "$SONAR_TOKEN" || -z "$SONAR_PROJECT_KEY" || -z "$SONAR_ORGANIZATION" ]]; then
            echo "::error::Set SONAR_TOKEN, SONAR_PROJECT_KEY and SONAR_ORGANIZATION before running SonarCloud."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Analyze with SonarCloud
        uses: SonarSource/sonarcloud-github-action@4006f663ecaf1f8093e8e4abb9227f6041f52216
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}

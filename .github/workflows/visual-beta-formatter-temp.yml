name: Temporary format visual beta PR
on:
  push:
    branches:
      - feature/visual-ai-beta-reference-index-20261112
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[formatted-visual]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format new visual beta source and tests
        run: |
          npx prettier --write \
            .github/workflows/pages.yml \
            scripts/prepare-visual-beta-input.mjs \
            scripts/verify-visual-beta.mjs \
            src/data/visual-beta.ts \
            src/data/visual-search.ts \
            src/data/visual-worker.ts \
            src/ui/profile-view.ts \
            src/ui/add-cards.ts \
            src/ui/page-scan.ts \
            tests/e2e/visual-beta.spec.ts
      - name: Commit formatted sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/pages.yml scripts src tests/e2e/visual-beta.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format visual model beta [formatted-visual]"
            git push origin HEAD:feature/visual-ai-beta-reference-index-20261112
          fi

name: Temporary fusion formatting diagnosis
on:
  push:
    branches: [feat/scanner-evidence-fusion-beta-20261113]
permissions:
  contents: read
jobs:
  format-diagnosis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Show exact Prettier edits for fusion tests
        run: |
          npx prettier --write tests/unit/scan-evidence-fusion.test.ts
          git diff -- tests/unit/scan-evidence-fusion.test.ts
          git diff --quiet -- tests/unit/scan-evidence-fusion.test.ts

name: Prepare PWA dependency lockfile
on:
  push:
    branches: [feat/ios-offline-pwa]
permissions:
  contents: write
jobs:
  lockfile:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ios-offline-pwa
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - name: Format the new PWA implementation
        run: |
          npx prettier --write package.json vite.config.ts src/pwa.ts src/pwa.css src/main.ts src/archive-main.ts src/vite-env.d.ts index.html archive.html scripts/generate-pwa-icons.mjs scripts/validate-pwa.mjs tests/e2e/pwa.spec.ts docs/pwa.md
      - name: Commit the reproducible dependency lockfile and formatted sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json package.json vite.config.ts src/pwa.ts src/pwa.css src/main.ts src/archive-main.ts src/vite-env.d.ts index.html archive.html scripts/generate-pwa-icons.mjs scripts/validate-pwa.mjs tests/e2e/pwa.spec.ts docs/pwa.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore: lock and format PWA dependencies [skip ci]'
            git push origin HEAD:feat/ios-offline-pwa
          fi

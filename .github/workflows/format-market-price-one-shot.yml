name: Format market source tests
on:
  push:
    branches: [release/rare-room-liquid-collector-20261110]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format source tests and remove helper
        run: |
          npx prettier --write tests/unit/market-price-fallback.test.ts
          git rm .github/workflows/format-market-price-one-shot.yml
          git add tests/unit/market-price-fallback.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Format exact-price fallback scenarios"
          git push origin HEAD:release/rare-room-liquid-collector-20261110
      - run: npm run check

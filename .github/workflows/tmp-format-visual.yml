name: Temporary visual-first formatter
on:
  push:
    branches:
      - feat/image-first-visual-retrieval-20261110
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format visual recognition files
        run: |
          npx prettier --write src/domain/visual-retrieval.ts src/data/visual-worker.ts src/data/visual-search.ts src/data/recognize.ts src/data/vision-worker.ts src/data/card-catalog.ts src/ui/page-scan.ts src/workspace.css tests/unit/visual-retrieval.test.ts docs/scanner.md docs/visual-recognition.md scripts/pack-visual-index.mjs
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/domain/visual-retrieval.ts src/data/visual-worker.ts src/data/visual-search.ts src/data/recognize.ts src/data/vision-worker.ts src/data/card-catalog.ts src/ui/page-scan.ts src/workspace.css tests/unit/visual-retrieval.test.ts docs/scanner.md docs/visual-recognition.md scripts/pack-visual-index.mjs
            git commit -m "Format visual retrieval implementation"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

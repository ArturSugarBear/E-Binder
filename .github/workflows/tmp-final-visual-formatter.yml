name: Temporary final visual formatter
on:
  push:
    branches:
      - feat/image-first-visual-retrieval-20261110
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write scripts/pack-visual-index.mjs src/data/visual-worker.ts
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/pack-visual-index.mjs src/data/visual-worker.ts
            git commit -m "Format versioned embedding preprocessing"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

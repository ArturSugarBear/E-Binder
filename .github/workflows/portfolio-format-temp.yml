name: Temporary portfolio formatter
on:
  push:
    branches:
      - feat/portfolio-v1-priced-binder-pages-20261110
permissions:
  contents: write
jobs:
  prettier:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/portfolio-v1-priced-binder-pages-20261110
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/domain/portfolio.ts src/ui/portfolio-view.ts src/ui/workspace.ts tests/e2e/portfolio.spec.ts tests/unit/portfolio.test.ts
      - name: Commit formatting and remove this temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/portfolio-format-temp.yml
          git add src/domain/portfolio.ts src/ui/portfolio-view.ts src/ui/workspace.ts tests/e2e/portfolio.spec.ts tests/unit/portfolio.test.ts
          git commit -m "Format portfolio feature and remove temporary formatter"
          git push origin HEAD:refs/heads/feat/portfolio-v1-priced-binder-pages-20261110

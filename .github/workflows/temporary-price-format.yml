name: Temporary price PR formatter
on:
  push:
    branches:
      - fix/verified-price-pipeline

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/verified-price-pipeline
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: >
          npx prettier --write
          src/domain/price-integrity.ts
          src/data/card-catalog.ts
          src/data/holding-prices.ts
          src/data/portfolio-history.ts
          src/ui/portfolio-view.ts
          src/ui/collection-view.ts
          tests/unit/price-integrity.test.ts
          tests/unit/market-price-fallback.test.ts
          tests/unit/holding-prices-integrity.test.ts
          tests/e2e/collection-prices.spec.ts
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/domain/price-integrity.ts src/data/card-catalog.ts src/data/holding-prices.ts src/data/portfolio-history.ts src/ui/portfolio-view.ts src/ui/collection-view.ts tests/unit/price-integrity.test.ts tests/unit/market-price-fallback.test.ts tests/unit/holding-prices-integrity.test.ts tests/e2e/collection-prices.spec.ts
            git commit -m 'Format verified price pipeline'
            git push origin HEAD:fix/verified-price-pipeline
          fi

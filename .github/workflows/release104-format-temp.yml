name: Temporary PR104 format verification
on:
  push:
    branches:
      - fix/release-provenance-and-classic-gallery-20261112
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[format-release104]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply exact project Prettier configuration
        run: |
          npx prettier --write \
            index.html \
            vite.config.ts \
            src/pwa.ts \
            src/workspace.css \
            src/data/app-version.ts \
            src/data/artwork-fallbacks.ts \
            src/ui/catalog-browser.ts \
            src/ui/profile-view.ts \
            tests/e2e/release-provenance.spec.ts \
            tests/e2e/classic-collection.spec.ts
      - name: Commit only actual formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html vite.config.ts src/pwa.ts src/workspace.css src/data/app-version.ts src/data/artwork-fallbacks.ts src/ui/catalog-browser.ts src/ui/profile-view.ts tests/e2e/release-provenance.spec.ts tests/e2e/classic-collection.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format build provenance and Classic image fallback [format-release104]"
            git push origin HEAD:fix/release-provenance-and-classic-gallery-20261112
          fi

name: Temporary artwork gate formatter
on:
  push:
    branches: [fix/release-artwork-provider-resilience-20261112]
permissions:
  contents: write
jobs:
  prettier:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write scripts/release-artwork-gate.mjs
      - name: Commit formatting output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/release-artwork-gate.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'Format artwork release gate'
            git push
          fi

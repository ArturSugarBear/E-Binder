name: Temporary scanner code check
on:
  push:
    branches:
      - feat/scanner-auto-page-outline-20261110
permissions:
  contents: write
jobs:
  format-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format changed scanner code
        run: |
          npx prettier --write src/ui/page-scan.ts
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/ui/page-scan.ts
            git commit -m "Format scanner session reuse"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Run full code quality check
        run: npm run check

name: Temporary final scan formatter
on:
  push:
    branches: [fix/scanner-onehand-review-20261112]
permissions:
  contents: write
jobs:
  prettier:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/ui/page-scan.ts tests/e2e/photo-review.spec.ts
      - name: Commit formatter output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ui/page-scan.ts tests/e2e/photo-review.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m 'Format updated binder review messages'
            git push
          fi

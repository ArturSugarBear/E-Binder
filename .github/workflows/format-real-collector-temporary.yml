name: Format real collector fixes
on:
  push:
    branches:
      - fix/real-collector-flows-20261110
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'ArturSugarBear/E-Binder'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format this feature and remove the one-shot formatter
        run: |
          npx prettier --write src/ui/catalog-browser.ts src/data/card-catalog.ts src/ui/portfolio-view.ts src/ui/page-scan.ts src/ui/live-page-scan.ts src/workspace.css src/catalog.css tests/e2e/real-collector-flows.spec.ts
          git rm .github/workflows/format-real-collector-temporary.yml
          git add src/ui/catalog-browser.ts src/data/card-catalog.ts src/ui/portfolio-view.ts src/ui/page-scan.ts src/ui/live-page-scan.ts src/workspace.css src/catalog.css tests/e2e/real-collector-flows.spec.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Format real-user collector fixes"
            git push origin HEAD:fix/real-collector-flows-20261110
          fi

name: Temporary scanner formatter
on:
  push:
    branches:
      - qa/scanner-live-battle-tests-20261110
permissions:
  contents: write
jobs:
  prettier:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/scanner-live-battle-tests-20261110
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write docs/scanner-battle-tests.md scripts/benchmark-card-scans.mjs src/domain/live-card-lock.ts src/ui/live-scan.ts tests/e2e/live-scan-battle.spec.ts tests/unit/live-card-lock.test.ts
      - name: Remove temporary workflow and commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/scanner-format-temp.yml
          git add docs/scanner-battle-tests.md scripts/benchmark-card-scans.mjs src/domain/live-card-lock.ts src/ui/live-scan.ts tests/e2e/live-scan-battle.spec.ts tests/unit/live-card-lock.test.ts
          git commit -m "Format scanner suite and remove temporary formatter"
          git push origin HEAD:refs/heads/qa/scanner-live-battle-tests-20261110

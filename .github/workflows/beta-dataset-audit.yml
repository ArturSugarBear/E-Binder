name: Private beta dataset quality
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dataset-audit:
    runs-on: ubuntu-latest
    environment: beta-dataset
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Count independently reviewed dataset samples (no photo export)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/beta-dataset-audit.mjs

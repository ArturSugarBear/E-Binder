name: Format verified Cardmarket hotfix (temporary)
on:
  push:
    branches:
      - fix/verified-cardmarket-groudon-dlr111
    paths:
      - .github/workflows/format-verified-cardmarket.yml
permissions:
  contents: write
jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/verified-cardmarket-groudon-dlr111
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format only the price hotfix files
        run: >
          npx prettier --write
          src/data/card-catalog.ts
          src/data/holding-prices.ts
          src/data/verified-cardmarket.ts
          src/domain/portfolio.ts
          src/ui/card-market.ts
          src/ui/collection-view.ts
          src/workspace.css
          tests/unit/market-price-fallback.test.ts
          tests/unit/holding-prices-integrity.test.ts
          tests/unit/verified-cardmarket.test.ts
      - name: Commit formatting if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/card-catalog.ts src/data/holding-prices.ts src/data/verified-cardmarket.ts src/domain/portfolio.ts src/ui/card-market.ts src/ui/collection-view.ts src/workspace.css tests/unit/market-price-fallback.test.ts tests/unit/holding-prices-integrity.test.ts tests/unit/verified-cardmarket.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "Format verified Cardmarket hotfix"
            git push origin HEAD:fix/verified-cardmarket-groudon-dlr111
          fi

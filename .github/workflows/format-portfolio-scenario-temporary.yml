name: Format portfolio scenario
on:
  push:
    branches:
      - fix/real-collector-flows-20261110
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'ArturSugarBear/E-Binder'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format latest browser regression and remove workflow
        run: |
          npx prettier --write tests/e2e/real-collector-flows.spec.ts
          git rm .github/workflows/format-portfolio-scenario-temporary.yml
          git add tests/e2e/real-collector-flows.spec.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Format exact-price portfolio regression"
            git push origin HEAD:fix/real-collector-flows-20261110
          fi

name: Temporary Roboflow discovery formatter
on:
  push:
    branches: [feat/vision-readiness-gate]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format files
        run: npx prettier --write scripts/roboflow-projects.mjs scripts/roboflow-card-import.mjs tests/roboflow-projects.test.mjs docs/roboflow-detector.md
      - name: Commit source formatting
        run: |
          if ! git diff --quiet -- scripts/roboflow-projects.mjs scripts/roboflow-card-import.mjs tests/roboflow-projects.test.mjs docs/roboflow-detector.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/roboflow-projects.mjs scripts/roboflow-card-import.mjs tests/roboflow-projects.test.mjs docs/roboflow-detector.md
            git commit -m "style(dataset): format Roboflow workspace import and discovery"
            git push origin HEAD:feat/vision-readiness-gate
          fi

name: Temporary Roboflow source formatting
on:
  push:
    branches: [feat/vision-readiness-gate]
permissions:
  contents: write
jobs:
  prettier-roboflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format Roboflow importer and documentation
        run: npx prettier --write scripts/roboflow-card-import.mjs tests/roboflow-card-import.test.mjs docs/roboflow-detector.md
      - name: Commit formatting (when required)
        run: |
          if ! git diff --quiet -- scripts/roboflow-card-import.mjs tests/roboflow-card-import.test.mjs docs/roboflow-detector.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/roboflow-card-import.mjs tests/roboflow-card-import.test.mjs docs/roboflow-detector.md
            git commit -m "style(vision): run pinned Prettier on Roboflow importer"
            git push origin HEAD:feat/vision-readiness-gate
          fi

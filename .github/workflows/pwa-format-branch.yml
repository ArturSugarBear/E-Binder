name: Format PWA feature branch
on:
  push:
    branches: [feat/ios-offline-pwa]
permissions:
  contents: write
jobs:
  prettier:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ios-offline-pwa
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write index.html src/pwa.ts src/workspace.css tests/e2e/pwa.spec.ts
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html src/pwa.ts src/workspace.css tests/e2e/pwa.spec.ts
            git commit -m "style: format PWA and mobile navigation"
            git push origin HEAD:feat/ios-offline-pwa
          fi

name: Format vintage-edition hotfix once
on:
  push:
    branches:
      - fix/vintage-edition-stamp-review
    paths:
      - .github/workflows/format-vintage-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vintage-edition-stamp-review
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Sync and format exact hotfix files
        run: |
          git fetch origin fix/vintage-edition-stamp-review
          git reset --hard origin/fix/vintage-edition-stamp-review
          npx prettier --write src/domain/vintage-edition.ts src/ui/add-cards.ts tests/unit/vintage-edition.test.ts
      - name: Commit formatting and push branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/vintage-edition.ts src/ui/add-cards.ts tests/unit/vintage-edition.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "Format vintage edition safety hotfix"
            git push origin HEAD:fix/vintage-edition-stamp-review
          fi

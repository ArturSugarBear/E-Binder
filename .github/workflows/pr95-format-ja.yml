name: Temporary PR95 Japanese formatter
on:
  push:
    branches:
      - fix/30th-classic-art-and-live-scanner-20261112
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[formatted-ja]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format new Japanese resolver changes
        run: >
          npx prettier --write
          src/data/japanese-catalog.ts
          tests/unit/p0-resolvers.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/japanese-catalog.ts tests/unit/p0-resolvers.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format Japanese resolver additions [formatted-ja]"
            git push origin HEAD:fix/30th-classic-art-and-live-scanner-20261112
          fi

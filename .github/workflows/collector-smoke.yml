name: Collector UX smoke
# The main Pages workflow already executes the complete browser suite.
# Keep this targeted cross-engine smoke available manually without
# running npm ci/check/Playwright installation twice on each PR.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium webkit
      - name: Exercise portfolio and scanner across browser engines
        run: npx playwright test tests/e2e/liquid-collector.spec.ts tests/e2e/portfolio.spec.ts tests/e2e/real-collector-flows.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: collector-smoke-failures
          path: |
            test-results/
            playwright-report/
          retention-days: 5

name: One-shot format vision PR
on:
  push:
    branches: [feat/vision-readiness-gate]
permissions:
  contents: write
jobs:
  formatting:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vision-readiness-gate
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply pinned project formatter only to changed scanner files
        run: |
          npx prettier --write \
            src/data/cloud-store.ts \
            src/data/visual-search.ts \
            src/ui/workspace.ts \
            tests/unit/cloud-store.test.ts \
            tests/unit/visual-search.test.ts \
            tests/e2e/vision-inference.spec.ts
      - name: Commit canonical formatting to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cloud-store.ts src/data/visual-search.ts src/ui/workspace.ts \
            tests/unit/cloud-store.test.ts tests/unit/visual-search.test.ts \
            tests/e2e/vision-inference.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(vision): apply repository Prettier 3.9.10"
            git push origin HEAD:feat/vision-readiness-gate
          fi

name: Temporary visual cache formatter
on:
  push:
    branches:
      - feat/image-first-visual-retrieval-20261110
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write vite.config.ts src/data/visual-search.ts docs/visual-recognition.md
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add vite.config.ts src/data/visual-search.ts docs/visual-recognition.md
            git commit -m "Format offline image index caching"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

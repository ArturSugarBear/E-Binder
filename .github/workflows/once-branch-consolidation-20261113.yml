name: One-time E-Binder branch consolidation
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/once-branch-consolidation-20261113.yml'
permissions:
  contents: write
jobs:
  archive-and-delete:
    runs-on: ubuntu-latest
    steps:
      - name: Verify, archive, and delete obsolete branches
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            if (owner !== 'ArturSugarBear' || repo !== 'E-Binder' || context.ref !== 'refs/heads/master') {
              throw new Error('Wrong repository or branch');
            }
            const targets = [
              {
                branch: 'chore/vercel-quality-hub-20261113',
                expected: 'a36dcb3b5b808bb7f9b5bd99790e5df9cdf88482',
                archive: 'archive/branch-cleanup-20261113/chore-vercel-quality-hub'
              },
              {
                branch: 'feat/scanner-evidence-fusion-beta-20261113',
                expected: 'd5b6630164331e983a079831bb75342f80aa5660',
                archive: 'archive/branch-cleanup-20261113/feat-scanner-evidence-fusion-beta'
              },
              {
                branch: 'feat/vision-readiness-gate',
                expected: 'ff8175236cd971e5ed6d1fea2694a02ee858fb60',
                archive: 'archive/branch-cleanup-20261113/feat-vision-readiness-gate'
              }
            ];
            const master = await github.rest.repos.getBranch({owner,repo,branch:'master'});
            if (master.data.commit.sha !== context.sha) throw new Error('Master moved; do not run stale cleanup');
            for (const target of targets) {
              const current = await github.rest.repos.getBranch({owner,repo,branch:target.branch});
              if (current.data.commit.sha !== target.expected) {
                throw new Error('Ref moved: '+target.branch+' expected '+target.expected+' got '+current.data.commit.sha);
              }
            }
            core.info('All branch SHAs confirmed. Archiving before deletion.');
            for (const target of targets) {
              await github.rest.git.createRef({
                owner, repo, ref:'refs/tags/'+target.archive, sha:target.expected
              });
              core.info('Archived '+target.branch+' as tag '+target.archive);
            }
            for (const target of targets) {
              const verify = await github.rest.repos.getBranch({owner,repo,branch:target.branch});
              if (verify.data.commit.sha !== target.expected) throw new Error('Ref moved during cleanup: '+target.branch);
              await github.rest.git.deleteRef({owner,repo,ref:'heads/'+target.branch});
              core.info('Deleted branch '+target.branch);
            }
            const all = await github.paginate(github.rest.repos.listBranches,{owner,repo,per_page:100});
            const remaining = all.map(b=>b.name);
            core.info('Remaining branches: '+remaining.join(', '));
            if (remaining.length !== 1 || remaining[0] !== 'master') {
              throw new Error('Unexpected branches remain: '+remaining.join(', '));
            }

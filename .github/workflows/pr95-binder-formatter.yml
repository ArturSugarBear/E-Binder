name: PR95 binder test formatter (self-removing)
on:
  push:
    branches:
      - fix/30th-classic-art-and-live-scanner-20261112
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/e2e/binder-card-artwork.spec.ts
      - name: Commit formatted test and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr95-binder-formatter.yml
          git add tests/e2e/binder-card-artwork.spec.ts
          git commit -m "style(test): format binder artwork regression"
          git push origin HEAD:fix/30th-classic-art-and-live-scanner-20261112

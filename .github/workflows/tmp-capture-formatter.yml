name: Temporary capture-and-OCR formatter
on:
  push:
    branches:
      - fix/capture-first-and-ocr-name-fallback-20261110
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format capture dialog and recognition fallback
        run: |
          npx prettier --write src/ui/add-cards.ts src/data/card-catalog.ts src/data/vision-worker.ts src/ui/page-scan.ts src/domain/recognition-names.ts src/workspace.css tests/e2e/workspace.spec.ts tests/e2e/catalog-browser.spec.ts tests/unit/recognition-names.test.ts docs/scanner.md
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/ui/add-cards.ts src/data/card-catalog.ts src/data/vision-worker.ts src/ui/page-scan.ts src/domain/recognition-names.ts src/workspace.css tests/e2e/workspace.spec.ts tests/e2e/catalog-browser.spec.ts tests/unit/recognition-names.test.ts docs/scanner.md
            git commit -m "Format capture-first and OCR fallback"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

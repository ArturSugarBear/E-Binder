name: Format developer beta feature
on:
  push:
    branches:
      - feat/artur-dev-beta-diagnostics-20261110
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'ArturSugarBear/E-Binder'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format diagnostic feature and remove temporary formatter
        run: |
          npx prettier --write src/data/beta-diagnostics.ts src/ui/add-cards.ts src/ui/live-scan.ts src/ui/profile-view.ts src/ui/workspace.ts tests/unit/beta-diagnostics.test.ts
          git rm .github/workflows/format-beta-temporary.yml
          git add src/data/beta-diagnostics.ts src/ui/add-cards.ts src/ui/live-scan.ts src/ui/profile-view.ts src/ui/workspace.ts tests/unit/beta-diagnostics.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Format beta diagnostics with repository Prettier"
            git push origin HEAD:feat/artur-dev-beta-diagnostics-20261110
          fi
